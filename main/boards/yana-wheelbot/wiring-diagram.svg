<text x="65" y="1526" fill="#77511c" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">* Check before powering on: GPIO20 is native USB D+; GPIO3 and GPIO45 are strapping pins; GPIO9 backlight may need a transistor driver.</text>
<text x="65" y="1550" fill="#77511c" font-family="Arial, Helvetica, sans-serif" font-size="15">Default firmware uses ST7789 + VL53L0X + 4 servos. ST7735/VL6180X need matching build options. L298N/HC-SR04 are alternatives, not shown.</text>
