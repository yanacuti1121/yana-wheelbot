<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1590" role="img" aria-labelledby="title desc">
<title id="title">Complete Yana Wheelbot wiring schematic</title>
<desc id="desc">A clear full wiring schematic with battery-to-boost power path and short horizontal signal wires from all eight modules to ESP32-S3 GPIO terminals.</desc>
<rect width="1800" height="1590" fill="#f4f7fa"/>
<text x="45" y="60" fill="#11243a" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700">YANA WHEELBOT · COMPLETE WIRING</text>
<text x="45" y="90" fill="#50677c" font-family="Arial, Helvetica, sans-serif" font-size="19">ESP32-S3-WROOM-1 N16R8 · firmware defaults · follow each short wire and its GPIO label</text>
<rect x="45" y="112" width="1710" height="308" rx="18" fill="white" stroke="#d5e0e8" stroke-width="2"/>
<text x="72" y="151" fill="#173a55" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">POWER FIRST</text>
<text x="72" y="181" fill="#4f6477" font-family="Arial, Helvetica, sans-serif" font-size="16">USB 5V charges the cell through TP4056. Its protected output feeds a separate regulated 5V boost converter.</text>
<rect x="70" y="209" width="300" height="86" rx="11" fill="#fff4e8" stroke="#d37c23" stroke-width="2"/>
<text x="86" y="243" fill="#673b16" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">1S LiPo</text>
<text x="86" y="271" fill="#825e3b" font-family="Arial, Helvetica, sans-serif" font-size="15">3.0–4.2V</text>
<rect x="410" y="209" width="390" height="86" rx="11" fill="#fff4e8" stroke="#d37c23" stroke-width="2"/>
<text x="426" y="243" fill="#673b16" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">TP4056 + protection</text>
<text x="426" y="271" fill="#825e3b" font-family="Arial, Helvetica, sans-serif" font-size="15">B+/B− battery · OUT+/OUT− load</text>
<rect x="860" y="209" width="300" height="86" rx="11" fill="#fff4e8" stroke="#d37c23" stroke-width="2"/>
<text x="876" y="243" fill="#673b16" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">ON/OFF switch</text>
<text x="876" y="271" fill="#825e3b" font-family="Arial, Helvetica, sans-serif" font-size="15">on protected output</text>
<rect x="1210" y="209" width="300" height="86" rx="11" fill="#fff4e8" stroke="#d37c23" stroke-width="2"/>
<text x="1226" y="243" fill="#673b16" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">5V boost</text>
<text x="1226" y="271" fill="#825e3b" font-family="Arial, Helvetica, sans-serif" font-size="15">regulated · rated for servo peaks</text>
<path d="M370 251 H398" fill="none" stroke="#d37c23" stroke-width="5" marker-end="url(#arrow)"/>
<path d="M800 251 H848" fill="none" stroke="#d37c23" stroke-width="5" marker-end="url(#arrow)"/>
<path d="M1160 251 H1198" fill="none" stroke="#d37c23" stroke-width="5" marker-end="url(#arrow)"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#d37c23"/></marker></defs>
<text x="72" y="329" fill="#1c7559" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">3V3 from ESP → INMP441, VL53L0X, TTP223, ST7789</text>
<text x="785" y="329" fill="#a65a1b" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">5V boost → ESP 5V/VIN, MAX98357A, all 4 servos</text>
<text x="72" y="363" fill="#4c5967" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">COMMON GND → ESP, boost, every sensor, display, amplifier, LEDs, and servos</text>
<text x="72" y="394" fill="#67788a" font-family="Arial, Helvetica, sans-serif" font-size="15">TP4056 is a charger, not a 5V boost. Verify polarity and 5V output with a meter before connecting the ESP32.</text>
