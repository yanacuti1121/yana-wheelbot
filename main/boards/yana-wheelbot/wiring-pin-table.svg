<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1620 1120" role="img" aria-labelledby="title desc">
<title id="title">Yana Wheelbot pin-by-pin wiring chart</title>
<desc id="desc">Nine separate wiring tables for the ESP32-S3 Wheelbot firmware default configuration. No crossing wires.</desc>
<rect width="1620" height="1120" fill="#f4f7fa"/>
<text x="40" y="55" fill="#12243b" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">YANA WHEELBOT · WIRING BY MODULE</text>
<text x="40" y="85" fill="#50677e" font-family="Arial, Helvetica, sans-serif" font-size="18">ESP32-S3-WROOM-1 N16R8 · firmware defaults from config.h · one row = one connection</text>
<rect x="40" y="102" width="1540" height="48" rx="9" fill="#e3eaf2"/>
<text x="62" y="133" fill="#176043" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">3V3 = logic modules</text>
<text x="540" y="133" fill="#a25316" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">5V external = servos + amp + ESP VIN</text>
<text x="1120" y="133" fill="#39495a" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">GND = shared by all</text>
