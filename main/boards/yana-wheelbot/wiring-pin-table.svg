<rect x="40" y="1056" width="1540" height="44" rx="8" fill="#fff0d6"/>
<text x="55" y="1083" fill="#724c15" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600">* GPIO20 is native USB D+; GPIO3 and GPIO45 are boot strapping pins. Verify on the actual board before wiring. GPIO9 backlight may need a transistor driver.</text>
<text x="40" y="1035" fill="#53687b" font-family="Arial, Helvetica, sans-serif" font-size="15">ST7735 / VL6180X need matching build options. L298N and HC-SR04 are alternatives, not wired in this default chart. Check module labels before power-up.</text>
